# This file is public. Never put a token in this configuration.
backend:
  name: github
  repo: JooREC0/JooREC0.github.io
  branch: main
  auth_methods: [token]

site_url: https://joorec0.github.io
display_url: https://joorec0.github.io
locale: ko
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: 블로그
    label_singular: 글
    folder: src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    preview_path: '/blog/{{filename}}/'
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 요약, widget: text }
      - { name: pubDate, label: 작성 날짜, widget: datetime, type: date }
      - { name: updatedDate, label: 수정 날짜, widget: datetime, type: date, required: false }
      - name: category
        label: 분류
        widget: select
        default: Learning Notes
        options: [Learning Notes, Troubleshooting, Project Retrospective, Infrastructure, Security Research, Thoughts]
      - name: tags
        label: 태그
        widget: list
        required: false
        default: []
        field: { name: tag, label: 태그, widget: string }
      - { name: relatedRepo, label: 관련 GitHub 저장소, widget: string, required: false, hint: 'https://github.com/ 으로 시작하는 원문 링크를 입력하세요.' }
      - name: draft
        label: 초안으로 보관
        widget: boolean
        default: true
        hint: '초안은 사이트·RSS에 표시되지 않습니다. 공개 GitHub 저장소의 파일 원문은 공개됩니다.'
      - { name: body, label: 본문, widget: richtext, modes: [rich_text, raw] }
  - name: pages
    label: 소개·프로젝트·연구
    files:
      - name: about
        label: About 소개
        file: src/content/pages/about.md
        fields:
          - { name: title, label: 페이지 제목, widget: string }
          - { name: description, label: 요약, widget: text }
          - { name: body, label: 본문, widget: richtext, modes: [rich_text, raw] }
      - name: projects
        label: Projects 프로젝트
        file: src/content/pages/projects.md
        fields:
          - { name: title, label: 페이지 제목, widget: string }
          - { name: description, label: 요약, widget: text }
          - { name: body, label: 본문, widget: richtext, modes: [rich_text, raw] }
      - name: research
        label: Research 탐구 기록
        file: src/content/pages/research.md
        fields:
          - { name: title, label: 페이지 제목, widget: string }
          - { name: description, label: 요약, widget: text }
          - { name: body, label: 본문, widget: richtext, modes: [rich_text, raw] }
